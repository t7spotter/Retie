{% extends "base.html" %}

{% block title %}Reset email sent — Retie{% endblock %}

{% block body %}
<div class="grid min-h-screen place-items-center px-4">
  <div class="w-full max-w-sm rounded-2xl border border-stone-200 bg-white p-6 text-center shadow-sm dark:border-stone-800 dark:bg-stone-900">
    <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-indigo-50 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-400">
      <i data-lucide="mail-check" class="h-6 w-6"></i>
    </span>
    <h1 class="mt-4 text-lg font-semibold tracking-tight text-stone-900 dark:text-white">Check your email</h1>
    <p class="mt-1.5 text-sm text-stone-500 dark:text-stone-400">If an account exists for that address, a password reset link has been sent. It expires after a short while.</p>
    <a href="{% url 'login' %}" class="mt-5 inline-block rounded-xl border border-stone-300 px-4 py-2.5 text-sm font-medium text-stone-700 hover:bg-stone-50 dark:border-stone-700 dark:text-stone-200 dark:hover:bg-stone-800">Back to log in</a>
  </div>
</div>
{% endblock %}
