{% extends "base.html" %}
{% load static %}

{% block title %}Password reset sent — Retie{% endblock %}

{% block body %}
<div class="grid min-h-screen place-items-center px-4">
  <div class="w-full max-w-sm text-center">
    <span class="rt-avatar mx-auto grid h-14 w-14 place-items-center rounded-full bg-violet-soft text-violet-ink">
      <i data-lucide="mail-check" class="h-7 w-7"></i>
    </span>
    <h1 class="title mt-5 text-ink">Check your email</h1>
    <p class="mt-2 body-sm text-ink-soft">If an account exists for that email, we've sent instructions for setting a new password.</p>
    <a href="{% url 'login' %}" class="rt-btn rt-btn-primary mt-6">Back to log in</a>
  </div>
</div>
{% endblock %}
