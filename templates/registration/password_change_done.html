{% extends "base.html" %}
{% load static %}

{% block title %}Password changed — Retie{% endblock %}

{% block body %}
<div class="grid min-h-screen place-items-center px-4">
  <div class="w-full max-w-sm text-center">
    <span class="rt-avatar mx-auto grid h-14 w-14 place-items-center rounded-full bg-success-soft text-success">
      <i data-lucide="circle-check" class="h-7 w-7"></i>
    </span>
    <h1 class="title mt-5 text-ink">Password changed</h1>
    <p class="mt-2 body-sm text-ink-soft">Your password has been updated.</p>
    <a href="{% url 'profile' %}" class="rt-btn rt-btn-primary mt-6">Back to profile</a>
  </div>
</div>
{% endblock %}
