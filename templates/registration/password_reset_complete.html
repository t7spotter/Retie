{% extends "base.html" %}
{% load static %}

{% block title %}Password reset — Retie{% endblock %}

{% block body %}
<div class="grid min-h-screen place-items-center px-4">
  <div class="rt-card is-raised w-full max-w-sm text-center">
    <span class="rt-avatar mx-auto grid h-12 w-12 place-items-center rounded-full bg-success-soft text-success">
      <i data-lucide="circle-check" class="h-6 w-6"></i>
    </span>
    <h1 class="heading mt-4 text-ink">Password reset complete</h1>
    <p class="mt-1.5 body-sm text-ink-soft">You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="rt-btn rt-btn-primary mt-5">Log in</a>
  </div>
</div>
{% endblock %}
