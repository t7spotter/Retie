{% extends "base.html" %}

{% block title %}Password reset — Shorty{% endblock %}

{% block body %}
<div class="grid min-h-screen place-items-center px-4">
  <div class="w-full max-w-sm rounded-2xl border border-stone-200 bg-white p-6 text-center shadow-sm dark:border-stone-800 dark:bg-stone-900">
    <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-emerald-50 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-400">
      <i data-lucide="circle-check" class="h-6 w-6"></i>
    </span>
    <h1 class="mt-4 text-lg font-semibold tracking-tight text-stone-900 dark:text-white">Password reset complete</h1>
    <p class="mt-1.5 text-sm text-stone-500 dark:text-stone-400">You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="mt-5 inline-block rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-500">Log in</a>
  </div>
</div>
{% endblock %}
