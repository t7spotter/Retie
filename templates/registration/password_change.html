{% extends "base.html" %}

{% block title %}Change password — Retie{% endblock %}

{% block body %}
<div class="mx-auto max-w-md px-4 py-12">
  <a href="{% url 'profile' %}" class="mb-6 inline-flex items-center gap-2 text-sm font-medium text-stone-500 hover:text-stone-800 dark:text-stone-400 dark:hover:text-stone-200">
    <i data-lucide="arrow-left" class="h-4 w-4"></i> Back to profile
  </a>

  <div class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm dark:border-stone-800 dark:bg-stone-900">
    <h1 class="text-lg font-semibold tracking-tight text-stone-900 dark:text-white">Change password</h1>

    <form method="post" class="mt-5 space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-stone-700 dark:text-stone-300">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
        <p class="mt-1 text-sm text-red-600 dark:text-red-400">{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}
      <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition-colors hover:bg-indigo-500">
        Change password
      </button>
    </form>
  </div>
</div>
{% endblock %}
