<!DOCTYPE html>
{% load static %}
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Retie — self-hosted link shortening{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <!-- ?v bumps whenever app.css is rebuilt so browsers drop stale copies. -->
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261020d">
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    (function () {
      try {
        var pref = localStorage.getItem("theme") || "system";
        var dark = pref === "dark" || (pref === "system"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : false);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen bg-stone-50 font-sans text-stone-800 antialiased transition-colors dark:bg-stone-950 dark:text-stone-200">
  {% block body %}{% endblock %}

  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/chart.umd.min.js' %}" defer></script>
  <script src="{% static 'vendor/lucide.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
