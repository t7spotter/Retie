{% extends "base.html" %}

{% block title %}Forbidden — Retie{% endblock %}

{% block body %}
<div class="grid min-h-screen place-items-center px-4">
  <div class="w-full max-w-sm text-center">
    <span class="rt-avatar mx-auto grid h-14 w-14 place-items-center rounded-full bg-warning-soft text-warning">
      <i data-lucide="shield-alert" class="h-7 w-7"></i>
    </span>
    <h1 class="title mt-5 text-ink">Access denied</h1>
    <p class="mt-2 body-sm text-ink-soft">{% if exception %}{{ exception }}{% else %}You don't have permission to view this page.{% endif %}</p>
    <a href="{% url 'dashboard' %}" class="rt-btn rt-btn-primary mt-6">Go home</a>
  </div>
</div>
{% endblock %}
